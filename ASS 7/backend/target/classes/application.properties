# ===== Server =====
server.port=8080

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore_db
spring.datasource.username=postgres
spring.datasource.password=Khushal@1079
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# 256-bit+ secret, base64 or plain - replace in production and move to env var
app.jwt.secret=ReplaceThisWithA256BitMinimumSecretKeyForJwtSigningInProd
app.jwt.expiration-ms=86400000

# ===== CORS (frontend origin) =====
app.cors.allowed-origins=http://localhost:3000

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true